*{margin:0;padding:0;box-sizing:border-box}
:root{
 --ink:#0d2a22; --paper:#fbf8f0; --gold:#c9a227; --gold-l:#f2dfa4;
 --emerald:#0e4636; --emerald-d:#07281f; --line:rgba(201,162,39,.34);
 --shadow:0 24px 70px rgba(0,0,0,.45);
}
html,body{height:100%}
body{
 font-family:'AmiriX','Amiri','Noto Naskh Arabic',serif;background:var(--emerald-d);
 color:var(--paper);overflow:hidden;
}
/* ============ المشهد ============ */
#stage{position:fixed;inset:0;display:grid;place-items:center;padding:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;transition:opacity 1.1s ease, transform 9s linear;transform:scale(1.06)}
.bg.on{opacity:.5;transform:scale(1)}
.scrim{position:absolute;inset:0;background:
  radial-gradient(ellipse at 50% 30%, rgba(7,40,31,.35), rgba(7,40,31,.92) 78%),
  linear-gradient(180deg, rgba(7,40,31,.75), rgba(7,40,31,.86))}
/* ============ الشريحة ============ */
.slide{position:relative;width:100%;max-width:1180px;height:100%;display:grid;
       grid-template-rows:auto 1fr auto;padding:clamp(14px,2.2vw,34px);gap:14px}
.shead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
       opacity:0;transform:translateY(-14px);transition:.7s ease}
.slide.in .shead{opacity:1;transform:none}
.kicker{font-size:clamp(11px,1.25vw,14px);letter-spacing:.06em;color:var(--gold-l);
        border:1px solid var(--line);border-radius:999px;padding:4px 14px;white-space:nowrap}
.shead h1{font-size:clamp(19px,3.2vw,40px);font-weight:700;line-height:1.35;flex:1;min-width:180px;
          color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.5)}
.tools{display:flex;gap:8px;align-items:center}

<script>
var SLIDES = [{"type": "cover", "kind": "غلاف", "title": "تفسير سورة يوسف (46-57)", "sub": "سورة يوسف", "bg": "geometric"}, {"type": "ayahs", "kind": "تلاوة وتدبّر", "title": "الآيات 46–51", "ayahs": [[46, "يُوسُفُ أَيُّهَا ٱلصِّدِّيقُ أَفْتِنَا فِى سَبْعِ بَقَرَٰتٍۢ سِمَانٍۢ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌۭ وَسَبْعِ سُنۢبُلَٰتٍ خُضْرٍۢ وَأُخَرَ يَابِسَٰتٍۢ لَّعَلِّىٓ أَرْجِعُ إِلَى ٱلنَّاسِ لَعَلَّهُمْ يَعْلَمُونَ"], [47, "قَالَ تَزْرَعُونَ سَبْعَ سِنِينَ دَأَبًۭا فَمَا حَصَدتُّمْ فَذَرُوهُ فِى سُنۢبُلِهِۦٓ إِلَّا قَلِيلًۭا مِّمَّا تَأْكُلُونَ"], [48, "ثُمَّ يَأْتِى مِنۢ بَعْدِ ذَٰلِكَ سَبْعٌۭ شِدَادٌۭ يَأْكُلْنَ مَا قَدَّمْتُمْ لَهُنَّ إِلَّا قَلِيلًۭا مِّمَّا تُحْصِنُونَ"], [49, "ثُمَّ يَأْتِى مِنۢ بَعْدِ ذَٰلِكَ عَامٌۭ فِيهِ يُغَاثُ ٱلنَّاسُ وَفِيهِ يَعْصِرُونَ"], [50, "وَقَالَ ٱلْمَلِكُ ٱئْتُونِى بِهِۦ ۖ فَلَمَّا جَآءَهُ ٱلرَّسُولُ قَالَ ٱرْجِعْ إِلَىٰ رَبِّكَ فَسْـَٔلْهُ مَا بَالُ ٱلنِّسْوَةِ ٱلَّٰتِى قَطَّعْنَ أَيْدِيَهُنَّ ۚ إِنَّ رَبِّى بِكَيْدِهِنَّ عَلِيمٌۭ"], [51, "قَالَ مَا خَطْبُكُنَّ إِذْ رَٰوَدتُّنَّ يُوسُفَ عَن نَّفْسِهِۦ ۚ قُلْنَ حَٰشَ لِلَّهِ مَا عَلِمْنَا عَلَيْهِ مِن سُوٓءٍۢ ۚ قَالَتِ ٱمْرَأَتُ ٱلْعَزِيزِ ٱلْـَٰٔنَ حَصْحَصَ ٱلْحَقُّ أَنَا۠ رَٰوَدتُّهُۥ عَن نَّفْسِهِۦ وَإِنَّهُۥ لَمِنَ ٱلصَّٰدِقِينَ"]], "bg": "light"}, {"type": "ayahs", "kind": "تلاوة وتدبّر", "title": "الآيات 52–57", "ayahs": [[52, "ذَٰلِكَ لِيَعْلَمَ أَنِّى لَمْ أَخُنْهُ بِٱلْغَيْبِ وَأَنَّ ٱللَّهَ لَا يَهْدِى كَيْدَ ٱلْخَآئِنِينَ"], [53, "۞ وَمَآ أُبَرِّئُ نَفْسِىٓ ۚ إِنَّ ٱلنَّفْسَ لَأَمَّارَةٌۢ بِٱلسُّوٓءِ إِلَّا مَا رَحِمَ رَبِّىٓ ۚ إِنَّ رَبِّى غَفُورٌۭ رَّحِيمٌۭ"], [54, "وَقَالَ ٱلْمَلِكُ ٱئْتُونِى بِهِۦٓ أَسْتَخْلِصْهُ لِنَفْسِى ۖ فَلَمَّا كَلَّمَهُۥ قَالَ إِنَّكَ ٱلْيَوْمَ لَدَيْنَا مَكِينٌ أَمِينٌۭ"], [55, "قَالَ ٱجْعَلْنِى عَلَىٰ خَزَآئِنِ ٱلْأَرْضِ ۖ إِنِّى حَفِيظٌ عَلِيمٌۭ"], [56, "وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِى ٱلْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَآءُ ۚ نُصِيبُ بِرَحْمَتِنَا مَن نَّشَآءُ ۖ وَلَا نُضِيعُ أَجْرَ ٱلْمُحْسِنِينَ"], [57, "وَلَأَجْرُ ٱلْءَاخِرَةِ خَيْرٌۭ لِّلَّذِينَ ءَامَنُوا۟ وَكَانُوا۟ يَتَّقُونَ"]], "bg": "ink"}, {"type": "points", "kind": "وقفات تدبّرية", "title": "وقفات تدبّرية", "points": ["المحور العام: مقاصد سورة يوسف في هذا المقطع.", "تأمّل الألفاظ: مناسبة كل لفظ لسياق الآية قبلها وبعدها.", "استخرج من الآيات اسمين من أسماء الله أو صفتين تدلّان على كماله.", "حدّد عملًا قلبيًا واحدًا وأمرًا عمليًا واحدًا تستفيده من المقطع."], "bg": "geometric"}, {"type": "quote", "kind": "خُلاصة", "title": "خُلاصة الدرس", "big": "المعنى العام للمقطع", "sub": "اقرأ الآيات مرتين: مرة للفظ، ومرة للمعنى، ثم اكتب خلاصتك بجملتين.", "bg": "ink"}, {"type": "quiz", "kind": "تقويم سريع", "title": "تقويم سريع", "q": "«أَفْتِنَا فِي سَبْعِ بَقَرَاتٍ سِمَانٍ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌ» طلب الفتوى جاء من:", "opts": [{"t": "الساقي وصاحبه الفتيان", "ok": true}, {"t": "الملك نفسه", "ok": false}, {"t": "امرأة العزيز", "ok": false}, {"t": "إخوة يوسف", "ok": false}], "a": 0, "why": "جاء الساقي الممنوع من التعبير إلى يوسف في السجن.", "bg": "geometric"}, {"type": "quiz", "kind": "تقويم سريع", "title": "تقويم سريع", "q": "«تَزْرَعُونَ سَبْعَ سِنِينَ دَأَبًا فَمَا حَصَدتُمُّ فَذَرُوهُ فِي سُنْبُلِهِ» التقدير كحكمة عملية يُفيد:", "opts": [{"t": "الاستعداد لسنوات الشدة بالادخار", "ok": true}, {"t": "الاستغناء عن الزراعة", "ok": false}, {"t": "بيع المحاصيل كله", "ok": false}, {"t": "ترك الأرض", "ok": false}], "a": 0, "why": "أمرهم بتخزين الحبوب في سنابلها للوقاية من التلف.", "bg": "geometric"}, {"type": "quote", "kind": "خِتام", "title": "انتهى الدرس", "big": "أحسنت إتمام الدرس", "sub": "الآن جرّب اللعبة التفاعلية واختبار الوحدة.", "bg": "light"}];
var LESSON = {"no": 11, "title": "تفسير سورة يوسف (46-57)", "unit": "سورة يوسف", "unitNo": 5, "surah": "يوسف"};

var AUDIO = ["https://everyayah.com/data/Ghamadi_40kbps/012046.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012047.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012048.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012049.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012050.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012051.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012052.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012053.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012054.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012055.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012056.mp3", "https://everyayah.com/data/Ghamadi_40kbps/012057.mp3"];

(function(){
  var i = 0, bgFlip = false, rec = document.getElementById('rec'), curTrack = -1, playing = false;
  var $ = function(s){ return document.querySelector(s); };

  var dots = document.getElementById('dots');

    var st = document.getElementById('startBtn');
    if (st) st.addEventListener('click', function(){ go(i+1); });

    document.getElementById('slide').classList.add('in');
  }

  function wireQuiz(s){
    var fb = document.getElementById('fb');
    Array.prototype.forEach.call(document.querySelectorAll('.qopt'), function(b){
      b.addEventListener('click', function(){

  function toggleAudio(){

    if (playing){ rec.pause(); playing = false; document.getElementById('btnAudio').classList.add('off'); return; }
    if (curTrack < 0){ curTrack = 0; rec.src = AUDIO[0]; }
    rec.play().then(function(){ playing = true; document.getElementById('btnAudio').classList.remove('off'); })
      .catch(function(){});
  }
  rec.addEventListener('ended', function(){
    curTrack++;
    if (curTrack < AUDIO.length){ rec.src = AUDIO[curTrack]; rec.play().catch(function(){}); }
    else { playing = false; curTrack = -1; document.getElementById('btnAudio').classList.add('off'); }
  });
  document.getElementById('btnAudio').addEventListener('click', toggleAudio);

  document.getElementById('next').addEventListener('click', function(){ go(i+1); });
  document.getElementById('prev').addEventListener('click', function(){ go(i-1); });
  document.getElementById('btnBack').addEventListener('click', function(){ location.href = 'العروض.html'; });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') go(i+1);
    if (e.key === 'ArrowRight') go(i-1);
    if (e.key === 'Escape') location.href = 'العروض.html';
    if (e.key === ' '){ e.preventDefault(); toggleAudio(); }
  });
  // السحب
  var x0 = null;
  document.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 60) go(i + (dx < 0 ? 1 : -1));
    x0 = null;
  }, {passive:true});

  go(0);
})();
</script>
</body>
</html>
