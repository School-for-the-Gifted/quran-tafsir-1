<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول الطالب — القرآن الكريم وتفسيره ١</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#0b241d;--emerald:#0e4636;--emerald-d:#07281f;--gold:#c9a227;--gold-l:#f2dfa4;
        --paper:#fbf8f0;--muted:#6b7d74;--line:#e6dfcd}
  body{font-family:"Noto Naskh Arabic","Amiri","Segoe UI",Tahoma,sans-serif;line-height:1.75;color:var(--ink)}
  svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
      stroke-linecap:round;stroke-linejoin:round}
  a{text-decoration:none;color:inherit}
  .page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
  /* الجهة البصرية */
  .art{position:relative;background:url('img-hero_portal.jpg') center/cover no-repeat;overflow:hidden}
  .art::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(4,26,20,.55),rgba(4,26,20,.9))}
  .art .cap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    justify-content:flex-end;padding:clamp(24px,4vw,52px);color:#fff}
  .art .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.08em;
    color:var(--gold-l);border:1px solid rgba(201,162,39,.5);border-radius:999px;padding:5px 13px;
    background:rgba(201,162,39,.12);margin-bottom:16px;width:fit-content}
  .art h2{font-size:clamp(22px,3.4vw,36px);line-height:1.3;font-weight:700;margin-bottom:10px;
    text-shadow:0 4px 26px rgba(0,0,0,.5)}
  .art p{font-size:14px;color:#cfe0d7;max-width:420px}
  .art .stats{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}
  .art .stats div b{display:block;font-size:22px;color:var(--gold-l)}
  .art .stats div span{font-size:11.5px;color:#a9c4b8}
  /* النموذج */
  .form{background:var(--paper);display:grid;place-items:center;padding:clamp(20px,4vw,52px)}
  .box{width:100%;max-width:420px}
  .box .mk{width:52px;height:52px;border-radius:14px;background:rgba(14,70,54,.08);
    border:1px solid rgba(201,162,39,.5);display:grid;place-items:center;color:#8a6f16;margin-bottom:16px}
  .box h1{font-size:25px;color:var(--emerald);margin-bottom:4px;font-weight:700}
  .box .lead{font-size:13.5px;color:var(--muted);margin-bottom:22px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12.5px;color:#5c6f66;font-weight:700;margin-bottom:5px}
  .fld input,.fld select{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid #d8cfb6;
    background:#fffdf6;font:inherit;font-size:15px;color:var(--ink)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--emerald);
    box-shadow:0 0 0 3px rgba(14,70,54,.12)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .go{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;
    background:linear-gradient(180deg,#17795c,#0b3d2e);color:#fff;cursor:pointer;margin-top:6px;
    box-shadow:0 14px 30px rgba(11,61,46,.26);transition:.2s}
  .go:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .msg{border-radius:10px;padding:9px 12px;font-size:13px;margin-top:11px;display:none;
    background:#fbeceb;color:#a8323c;border:1px solid #ecc9c6}
  .msg.on{display:block}
  .foot{display:flex;justify-content:space-between;margin-top:20px;font-size:13px}
  .foot a{color:#8a7a45;font-weight:700}
  .tip{background:#fdf6e4;border:1px solid #ead9a8;border-radius:10px;padding:9px 12px;
    font-size:12.5px;color:#7a6522;margin-bottom:16px}
  @media(max-width:880px){
    .page{grid-template-columns:1fr}
    .art{min-height:210px}
    .art .cap{padding:22px}
    .art .stats{display:none}
  }
</style>
</head>
<body>
<div class="page">

  <div class="art">
    <div class="cap">
      <span class="badge">القرآن الكريم وتفسيره ١</span>
      <h2>رحلة تعلّم التفسير<br>تبدأ باسمك</h2>
      <p>اختر اسمك من قائمة المعلم، تأكد من شعبتك، ثم ابدأ اللعبة أو الاختبار.</p>
      <div class="stats">
        <div><b>١٠</b><span>وحدات</span></div>
        <div><b>٢٥</b><span>درسًا</span></div>
        <div><b>١٠١ · ١٠٢ · ١٠٣</b><span>الشعب</span></div>
      </div>
    </div>
  </div>

  <div class="form">
    <form class="box" id="f">
      <div class="mk"><svg viewBox="0 0 24 24"><path d="M12 3l8 4-8 4-8-4 8-4z"/><path d="M4 11v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg></div>
      <h1>دخول الطالب</h1>
      <p class="lead">لا يحتاج إلى كلمة مرور.</p>

      <div class="tip" id="tip" style="display:none">
        لم يضف المعلم الأسماء بعد — اكتب اسمك يدويًا.
      </div>

      <div class="fld"><label>اسم الطالب</label>
        <select id="nameSel"><option value="__manual">— كتابة الاسم يدويًا —</option></select></div>

      <div class="fld" id="manualWrap" style="display:none"><label>اكتب اسمك الثلاثي</label>
        <input id="nameIn" type="text" placeholder="الاسم الثلاثي" autocomplete="name"></div>

      <div class="two">
        <div class="fld"><label>الصف</label>
          <select id="cls"><option>أول ثانوي</option></select></div>
        <div class="fld"><label>الشعبة</label>
          <select id="sec"><option>101</option><option>102</option><option>103</option></select></div>
      </div>

      <div class="fld"><label>المدرسة</label>
        <input id="school" type="text" placeholder="اسم المدرسة"></div>

      <button class="go" type="submit">ابدأ الآن</button>
      <div class="msg" id="msg"></div>

      <div class="foot">
        <a href="index.html">← الرئيسية</a>
        <a href="العروض.html">دروس المقرر</a>
      </div>
    </form>
  </div>

</div>

<script src="platform.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var sel=$("#nameSel");
  function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function fill(list){
    if(!list||!list.length){
      $("#tip").style.display="block"; $("#manualWrap").style.display="block"; return;
    }
    var by={};
    list.forEach(function(s){ (by[s.section||"101"]=by[s.section||"101"]||[]).push(s); });
    var order=["101","102","103"];
    var keys=order.filter(function(k){return by[k]}).concat(
      Object.keys(by).filter(function(k){return order.indexOf(k)<0}));
    var h='<option value="__manual">— كتابة الاسم يدويًا —</option>';
    keys.forEach(function(k){
      h+='<optgroup label="شعبة '+k+'">';
      by[k].forEach(function(s){
        h+='<option data-n="'+esc(s.name)+'" data-s="'+esc(s.section)+'">'+esc(s.name)+'</option>';
      });
      h+='</optgroup>';
    });
    sel.innerHTML=h;
    $("#tip").style.display="none";
  }

  sel.addEventListener("change", function(){
    var o=sel.options[sel.selectedIndex];
    var manual=(sel.value==="__manual");
    $("#manualWrap").style.display=manual?"block":"none";
    if(!manual){
      $("#nameIn").value=o.dataset.n||"";
      if(o.dataset.s) $("#sec").value=o.dataset.s;
    }
  });

  if (PF.name()) $("#nameIn").value=PF.name();
  $("#sec").value=PF.section();
  $("#school").value=PF.school();

  PF.studentsPublic().then(fill).catch(function(){
    $("#tip").style.display="block"; $("#manualWrap").style.display="block";
  });

  $("#f").addEventListener("submit", function(e){
    e.preventDefault();
    var nm;
    if(sel.value==="__manual") nm=$("#nameIn").value.trim();
    else {
      var o=sel.options[sel.selectedIndex];
      nm=(o.dataset.n||"").trim();
      if(o.dataset.s) $("#sec").value=o.dataset.s;
    }
    var m=$("#msg");
    if(nm.length<3){
      m.className="msg on";
      m.textContent="اختر اسمك من القائمة أو اكتبه (٣ أحرف على الأقل).";
      return;
    }
    PF.setStudent(nm);
    PF.setClass($("#cls").value, $("#sec").value);
    PF.school($("#school").value.trim());
    location.href="بوابة-الطالب.html";
  });
})();
</script>
</body>
</html>
