<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07281f">
<title>بوابة الطالب — القرآن الكريم وتفسيره ١</title>
<style>
@font-face{font-family:'AmiriX';src:url('amiri.woff2') format('woff2');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{--em:#0e4636;--ed:#07281f;--gold:#c9a227;--goldl:#f2dfa4;--paper:#fbf8f0;--ink:#0b241d;
  --muted:#6b7d74;--line:#e6dfcd;--sh:0 18px 44px rgba(6,32,25,.13)}
body{font-family:"Noto Naskh Arabic",'AmiriX',"Amiri",Tahoma,sans-serif;background:var(--paper);
  color:var(--ink);line-height:1.75}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* الترويسة */
header{background:linear-gradient(150deg,#07281f,#0e4636 55%,#0b3a2c);color:#fff;
  padding:20px 0 26px;border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;opacity:.14;
  background:url('img-unit_geometric.jpg') center/cover}
.hin{position:relative;max-width:1080px;margin:0 auto;padding:0 20px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
.hin .av{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;
  background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.5);color:var(--goldl)}
.hin .av svg{width:26px;height:26px}
.hin .who{flex:1;min-width:160px}
.hin .who b{display:block;font-size:19px;font-weight:700}
.hin .who span{font-size:12.5px;color:#bcd2c7}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hb{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;font-size:13px;
  border:1px solid rgba(255,255,255,.2);color:#dbe8e1;transition:.2s}
.hb:hover{background:rgba(255,255,255,.13);color:#fff}

/* شرائح الإحصاء */
.stats{max-width:1080px;margin:-18px auto 0;padding:0 20px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;position:relative;z-index:2}
.st{background:#fff;border:1px solid #eae3d2;border-radius:15px;padding:13px 15px;box-shadow:var(--sh)}
.st .l{font-size:11.5px;color:var(--muted);font-weight:700}
.st .v{font-size:23px;font-weight:700;color:var(--em);line-height:1.3}
.st .v small{font-size:12px;font-weight:400;color:var(--muted)}

.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
.sechead{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.sechead h2{font-size:17px;color:var(--em);font-weight:700}
.sechead .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sechead .cnt{font-size:12px;color:var(--muted);background:#f2ede0;border-radius:999px;padding:3px 11px}

/* الوحدات */
.unit{background:#fff;border:1px solid #eae3d2;border-radius:18px;margin-bottom:14px;overflow:hidden}
.uhead{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer;transition:.2s}
.uhead:hover{background:#fdfaf2}
.uhead .un{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
  background:rgba(14,70,54,.08);border:1px solid rgba(201,162,39,.45);color:#8a6f16;
  font-weight:700;font-size:15px}
.uhead .ut{flex:1;min-width:0}
.uhead .ut b{display:block;font-size:15px;color:var(--em)}
.uhead .ut span{font-size:11.5px;color:var(--muted)}
.uhead .chev{transition:.3s;color:var(--muted)}
.unit.open .uhead .chev{transform:rotate(180deg)}
.ubody{display:none;padding:0 12px 12px}
.unit.open .ubody{display:block}

/* بطاقة درس */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
  border:1px solid #f0ebdc;background:#fffdf8;margin-bottom:9px;transition:.2s}
.lrow.locked{background:#f7f4ea;border-style:dashed;opacity:.9}
.lrow .im{width:62px;height:48px;border-radius:9px;background-size:cover;background-position:center;
  flex-shrink:0;position:relative;overflow:hidden}
.lrow .im::after{content:"";position:absolute;inset:0;background:rgba(7,40,31,.28)}
.lrow .info{flex:1;min-width:0}
.lrow .info b{display:block;font-size:14px;color:var(--em);line-height:1.5}
.lrow .info span{font-size:11.5px;color:var(--muted)}
.lact{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:9px;
  font-size:12px;font-weight:700;background:#f1ecdd;color:var(--em);transition:.2s}
.pill svg{width:14px;height:14px}
.pill:hover{background:#e5ddc7}
.pill.pri{background:var(--em);color:#fff}
.pill.pri:hover{background:#125741}
.pill.off{opacity:.42;pointer-events:none;text-decoration:line-through}
.badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;
  background:#f7ecd0;color:#8a6f16;border:1px solid #e8d79f}
.badge.wait{background:#fbeceb;color:#a8323c;border-color:#ecc9c6}
.badge.new{background:#e7f4ec;color:#0e6b45;border-color:#bfe0cd}

/* صف حالة */
.empty{background:#fff;border:1px dashed #ddd4bc;border-radius:16px;padding:30px 20px;
  text-align:center;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--em);font-size:15px;margin-bottom:6px}

/* نتائجي */
.mine{margin-top:8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;
  border:1px solid #eae3d2;font-size:13px}
th,td{padding:10px 13px;text-align:right;border-bottom:1px solid #f2ede0}
th{background:#f7f3e7;color:#5c6f66;font-size:12px;font-weight:700}
tr:last-child td{border-bottom:0}
td .sc{font-weight:700;color:var(--em)}
td .ok{color:#0e6b45;font-weight:700}
td .no{color:#a8323c;font-weight:700}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}

#loading{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;z-index:50}
.spin{width:38px;height:38px;border:3px solid #e6dfcd;border-top-color:var(--em);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){
  .lrow{flex-wrap:wrap}.lrow .im{width:100%;height:80px}
  .hin .who b{font-size:16px}
  th,td{padding:8px 9px;font-size:12px}
}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div></div>

<header>
  <div class="hin">
    <div class="av"><svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M6 10v5c0 1.6 2.7 3 6 3s6-1.4 6-3v-5"/></svg></div>
    <div class="who">
      <b id="who">—</b>
      <span id="whoSub"></span>
    </div>
    <div class="hbtns">
      <button class="hb" id="btnMine"><svg viewBox="0 0 24 24"><path d="M6 4h9l4 4v12H6z"/><path d="M9 12h7M9 16h4"/></svg>نتائجي</button>
      <a class="hb" href="index.html"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>الرئيسية</a>
      <button class="hb" id="btnOut"><svg viewBox="0 0 24 24"><path d="M15 12H3M8 7l-5 5 5 5"/><path d="M15 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4"/></svg>خروج</button>
    </div>
  </div>
</header>

<div class="stats">
  <div class="st"><div class="l">الدروس المعتمدة</div><div class="v" id="sApp">٠ <small>/ ٢٥</small></div></div>
  <div class="st"><div class="l">ألعاب مفتوحة</div><div class="v" id="sGame">٠</div></div>
  <div class="st"><div class="l">اختبارات مفتوحة</div><div class="v" id="sExam">٠</div></div>
  <div class="st"><div class="l">محاولاتك</div><div class="v" id="sTry">٠</div></div>
</div>

<div class="wrap">
  <div class="sechead"><h2>دروسي</h2><div class="ln"></div><span class="cnt" id="uCnt"></span></div>
  <div id="units"></div>

  <div id="mineWrap" style="display:none">
    <div class="sechead"><h2>نتائجي</h2><div class="ln"></div></div>
    <div class="mine" id="mine"></div>
    <div class="note">تظهر لك درجاتك وحدها. النتائج الكاملة وسجل الإنجاز يراهما المعلم فقط.</div>
  </div>
</div>

<script src="platform.js"></script>
<script>
var UNITS = [{"u": 1, "name": "مقدمة في التفسير", "game": "لعبة-الوحدة-01-مقدمة-في-التفسير.html", "exam": "اختبار-الوحدة-01-مقدمة-في-التفسير.html", "img": "unit_quran_open", "lessons": [{"no": 1, "title": "التعريف بعلم التفسير ونشأته", "deck": "درس-01-التعريف-بعلم-التفسير-ونشأته.html", "img": "unit_quran_open"}, {"no": 2, "title": "أهمية علم التفسير وضوابطه", "deck": "درس-02-أهمية-علم-التفسير-وضوابطه.html", "img": "unit_mosque"}, {"no": 3, "title": "أبرز المؤلفات الموثوقة في التفسير", "deck": "درس-03-أبرز-المؤلفات-الموثوقة-في-التفسير.html", "img": "unit_manuscript"}, {"no": 4, "title": "التقنية في خدمة القرآن الكريم وتفسيره", "deck": "درس-04-التقنية-في-خدمة-القرآن-الكريم-وتفسيره.html", "img": "unit_sky"}]}, {"u": 2, "name": "سورة الفاتحة", "game": "لعبة-الوحدة-02-سورة-الفاتحة.html", "exam": "اختبار-الوحدة-02-سورة-الفاتحة.html", "img": "unit_mosque", "lessons": [{"no": 5, "title": "تفسير سورة الفاتحة", "deck": "درس-05-تفسير-سورة-الفاتحة.html", "img": "unit_geometric"}]}, {"u": 3, "name": "سورة يونس", "game": "لعبة-الوحدة-03-سورة-يونس.html", "exam": "اختبار-الوحدة-03-سورة-يونس.html", "img": "unit_manuscript", "lessons": [{"no": 6, "title": "تفسير سورة يونس (3-10)", "deck": "درس-06-تفسير-سورة-يونس-3-10.html", "img": "unit_light"}, {"no": 7, "title": "تفسير سورة يونس (26-33)", "deck": "درس-07-تفسير-سورة-يونس-26-33.html", "img": "unit_calligraphy"}, {"no": 8, "title": "تفسير سورة يونس (62-70)", "deck": "درس-08-تفسير-سورة-يونس-62-70.html", "img": "unit_quran_open"}]}, {"u": 4, "name": "سورة هود", "game": "لعبة-الوحدة-04-سورة-هود.html", "exam": "اختبار-الوحدة-04-سورة-هود.html", "img": "unit_sky", "lessons": [{"no": 9, "title": "تفسير سورة هود (96-108)", "deck": "درس-09-تفسير-سورة-هود-96-108.html", "img": "unit_mosque"}, {"no": 10, "title": "تفسير سورة هود (112-123)", "deck": "درس-10-تفسير-سورة-هود-112-123.html", "img": "unit_manuscript"}]}, {"u": 5, "name": "سورة يوسف", "game": "لعبة-الوحدة-05-سورة-يوسف.html", "exam": "اختبار-الوحدة-05-سورة-يوسف.html", "img": "unit_geometric", "lessons": [{"no": 11, "title": "تفسير سورة يوسف (46-57)", "deck": "درس-11-تفسير-سورة-يوسف-46-57.html", "img": "unit_sky"}, {"no": 12, "title": "تفسير سورة يوسف (102-111)", "deck": "درس-12-تفسير-سورة-يوسف-102-111.html", "img": "unit_geometric"}]}, {"u": 6, "name": "سورة الرعد", "game": "لعبة-الوحدة-06-سورة-الرعد.html", "exam": "اختبار-الوحدة-06-سورة-الرعد.html", "img": "unit_light", "lessons": [{"no": 13, "title": "تفسير سورة الرعد (8-15)", "deck": "درس-13-تفسير-سورة-الرعد-8-15.html", "img": "unit_light"}, {"no": 14, "title": "تفسير سورة الرعد (19-29)", "deck": "درس-14-تفسير-سورة-الرعد-19-29.html", "img": "unit_calligraphy"}]}, {"u": 7, "name": "سورة إبراهيم", "game": "لعبة-الوحدة-07-سورة-إبراهيم.html", "exam": "اختبار-الوحدة-07-سورة-إبراهيم.html", "img": "unit_calligraphy", "lessons": [{"no": 15, "title": "تفسير سورة إبراهيم (24-31)", "deck": "درس-15-تفسير-سورة-إبراهيم-24-31.html", "img": "unit_quran_open"}, {"no": 16, "title": "تفسير سورة إبراهيم (42-52)", "deck": "درس-16-تفسير-سورة-إبراهيم-42-52.html", "img": "unit_mosque"}]}, {"u": 8, "name": "سورة الحجر", "game": "لعبة-الوحدة-08-سورة-الحجر.html", "exam": "اختبار-الوحدة-08-سورة-الحجر.html", "img": "unit_quran_open", "lessons": [{"no": 17, "title": "تفسير سورة الحجر (28-50)", "deck": "درس-17-تفسير-سورة-الحجر-28-50.html", "img": "unit_manuscript"}, {"no": 18, "title": "تفسير سورة الحجر (85-99)", "deck": "درس-18-تفسير-سورة-الحجر-85-99.html", "img": "unit_sky"}]}, {"u": 9, "name": "سورة النحل", "game": "لعبة-الوحدة-09-سورة-النحل.html", "exam": "اختبار-الوحدة-09-سورة-النحل.html", "img": "unit_mosque", "lessons": [{"no": 19, "title": "تفسير سورة النحل (10-18)", "deck": "درس-19-تفسير-سورة-النحل-10-18.html", "img": "unit_geometric"}, {"no": 20, "title": "تفسير سورة النحل (112-117)", "deck": "درس-20-تفسير-سورة-النحل-112-117.html", "img": "unit_light"}, {"no": 21, "title": "تفسير سورة النحل (120-128)", "deck": "درس-21-تفسير-سورة-النحل-120-128.html", "img": "unit_calligraphy"}]}, {"u": 10, "name": "سورة الإسراء", "game": "لعبة-الوحدة-10-سورة-الإسراء.html", "exam": "اختبار-الوحدة-10-سورة-الإسراء.html", "img": "unit_manuscript", "lessons": [{"no": 22, "title": "تفسير سورة الإسراء (23-30)", "deck": "درس-22-تفسير-سورة-الإسراء-23-30.html", "img": "unit_quran_open"}, {"no": 23, "title": "تفسير سورة الإسراء (31-39)", "deck": "درس-23-تفسير-سورة-الإسراء-31-39.html", "img": "unit_mosque"}, {"no": 24, "title": "تفسير سورة الإسراء (78-87)", "deck": "درس-24-تفسير-سورة-الإسراء-78-87.html", "img": "unit_manuscript"}, {"no": 25, "title": "تفسير سورة الإسراء (105-111)", "deck": "درس-25-تفسير-سورة-الإسراء-105-111.html", "img": "unit_sky"}]}];
var VIDEO = "https://drive.google.com/file/d/12J8pFfgA8kr2lKHKY9tRr67uV214XtJ3/preview";

(function(){
  var $=function(s){return document.querySelector(s)};
  var ar=PF.arNum;
  var name=PF.name();
  if(!name){ location.replace("دخول-الطالب.html"); return; }

  function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var IC = {
    play:'<svg viewBox="0 0 24 24"><path d="M7 4l12 8-12 8z"/></svg>',
    video:'<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 11l6-3v8l-6-3z"/></svg>',
    game:'<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="9" rx="4"/><path d="M8 12h2M9 11v2M15 12h.01M17 12h.01"/></svg>',
    exam:'<svg viewBox="0 0 24 24"><path d="M6 4h9l4 4v12H6z"/><path d="M9 12h7M9 16h4"/></svg>',
    lock:'<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',
    chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
  };

  $("#who").textContent = "أهلًا، " + name;
  $("#whoSub").textContent = "الصف " + PF.klass() + " · الشعبة " + PF.section() +
    (PF.school() ? " · " + PF.school() : "");

  var LESS = {};   // no → {approved, parts, video_url, video_on}

  function partOn(no, k){
    var L = LESS[no];
    if (!L || !L.approved) return false;
    var p = L.parts || {};
    return p[k] !== false;
  }

  function svgToggle(open){
    return open ? '' : IC.lock;
  }

  function rowHTML(u, L){
    var on = LESS[L.no] && LESS[L.no].approved;
    var acts = '';
    if (on){
      var a=[];
      if (partOn(L.no,'slides')) a.push('<a class="pill pri" href="'+esc(L.deck)+'">'+IC.play+'<span>الشرح</span></a>');
      if (partOn(L.no,'video')){
        var v = (LESS[L.no].video_url||VIDEO);
        a.push('<button class="pill" data-video="'+esc(v)+'">'+IC.video+'<span>الفيديو</span></button>');
      }
      if (partOn(L.no,'game')) a.push('<a class="pill" href="'+esc(u.game)+'">'+IC.game+'<span>اللعبة</span></a>');
      if (partOn(L.no,'exam')) a.push('<a class="pill" href="'+esc(u.exam)+'">'+IC.exam+'<span>الاختبار</span></a>');
      acts = a.join('');
    } else {
      acts = '<span class="badge wait">لم يعتمد المعلم الدرس بعد</span>';
    }
    return '<div class="lrow'+(on?'':' locked')+'">'+
      '<div class="im" style="background-image:url(\'img-'+L.img+'.jpg\')"></div>'+
      '<div class="info"><b>'+esc(L.title)+'</b><span>الدرس '+ar(L.no)+' · الوحدة '+ar(u.u)+' — '+esc(u.name)+'</span></div>'+
      '<div class="lact">'+acts+'</div></div>';
  }

  function render(openUnits){
    var host=$("#units"), html='', app=0, gms=0, exs=0;
    UNITS.forEach(function(u){
      var rows = u.lessons.map(function(L){ return rowHTML(u,L); }).join('');
      var cnt = u.lessons.filter(function(L){ return LESS[L.no] && LESS[L.no].approved; }).length;
      if (cnt) app += cnt;
      if (u.game && gms>=0 && u.lessons.some(function(L){ return partOn(L.no,'game'); })) gms++;
      if (u.exam && u.lessons.some(function(L){ return partOn(L.no,'exam'); })) exs++;
      var open = (openUnits === true) || cnt>0;
      html += '<div class="unit'+(open?' open':'')+'">'+
        '<div class="uhead" data-u="'+u.u+'">'+
          '<div class="un">'+ar(u.u)+'</div>'+
          '<div class="ut"><b>'+esc(u.name)+'</b><span>'+ar(u.lessons.length)+' درسًا · '+
            (cnt? (ar(cnt)+' معتمد') : 'لم يُعتمد بعد') +'</span></div>'+
          (cnt?'<span class="badge new">'+ar(cnt)+' معتمد</span>':'<span class="badge wait">مغلق</span>')+
          '<span class="chev">'+IC.chev+'</span>'+
        '</div><div class="ubody">'+rows+'</div></div>';
    });
    host.innerHTML = html;
    $("#sApp").innerHTML = ar(app)+' <small>/ ٢٥</small>';
    $("#sGame").textContent = ar(gms);
    $("#sExam").textContent = ar(exs);
    $("#uCnt").textContent = ar(UNITS.length)+' وحدة';
  }

  $("#units").addEventListener('click', function(e){
    var h=e.target.closest('.uhead');
    if(h){ h.parentNode.classList.toggle('open'); return; }
    var b=e.target.closest('[data-video]');
    if(b){ openVideo(b.dataset.video); }
  });

  function openVideo(url){
    var w = document.createElement('div');
    w.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(4,26,20,.94);display:grid;place-items:center;padding:16px';
    w.innerHTML = '<div style="width:100%;max-width:1000px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid rgba(201,162,39,.4);position:relative">'+
      '<iframe src="'+url+'" style="width:100%;height:100%;border:0" allow="autoplay; encrypted-media" allowfullscreen></iframe>'+
      '<button style="position:absolute;top:8px;inset-inline-end:8px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:20px">×</button></div>';
    w.onclick=function(ev){ if(ev.target===w||ev.target.tagName==='BUTTON') w.remove(); };
    document.body.appendChild(w);
  }

  /* نتائجي */
  function loadMine(){
    var host=$("#mine");
    host.innerHTML='<div class="empty">جارٍ التحميل…</div>';
    PF.myResults(name).then(function(rows){
      rows = rows || [];
      $("#sTry").textContent = ar(rows.length);
      if(!rows.length){
        host.innerHTML='<div class="empty"><b>لا نتائج بعد</b>ستظهر درجاتك هنا بعد إكمال أول لعبة أو اختبار معتمد.</div>';
        return;
      }
      var html='<table><thead><tr><th>الوحدة</th><th>النوع</th><th>الدرجة</th><th>النسبة</th><th>النتيجة</th><th>التاريخ</th></tr></thead><tbody>';
      rows.forEach(function(r){
        var pct = r.total? Math.round(r.score/r.total*100) : 0;
        var d = (r.created_at||'').slice(0,10);
        html+='<tr><td>'+esc(r.unit_name||('الوحدة '+r.unit_no))+'</td>'+
          '<td>'+(r.kind==='exam'?'اختبار':'لعبة')+'</td>'+
          '<td class="sc">'+ar(r.score)+' / '+ar(r.total)+'</td>'+
          '<td>'+ar(pct)+'٪</td>'+
          '<td>'+(r.passed?'<span class="ok">ناجح</span>':'<span class="no">لم يجتز</span>')+'</td>'+
          '<td>'+ar(d)+'</td></tr>';
      });
      host.innerHTML = html+'</tbody></table>';
    }).catch(function(err){
      host.innerHTML='<div class="empty"><b>تعذّر تحميل النتائج</b>'+esc(err.message||'')+'</div>';
    });
  }
  $("#btnMine").onclick = function(){
    var w=$("#mineWrap");
    var show = w.style.display==='none';
    w.style.display = show?'block':'none';
    if(show){ loadMine(); w.scrollIntoView({behavior:'smooth',block:'start'}); }
  };
  $("#btnOut").onclick = function(){
    PF.setStudent(""); PF.setClass("","");
    location.href="index.html";
  };

  /* التحميل */
  PF.lessons().then(function(rows){
    (rows||[]).forEach(function(r){ LESS[r.no]=r; });
    render(false);
    $("#loading").style.display='none';
  }).catch(function(err){
    // بلا اتصال: نستخدم النسخة المخزّنة
    (PF.lessonsCached()||[]).forEach(function(r){ LESS[r.no]=r; });
    render(false);
    $("#loading").style.display='none';
  });
})();
</script>
</body>
</html>
