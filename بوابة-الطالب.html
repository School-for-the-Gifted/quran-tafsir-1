<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الطالب — القرآن الكريم وتفسيره ١</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#0b241d;--emerald:#0e4636;--emerald-d:#07281f;--gold:#c9a227;--gold-l:#f2dfa4;
        --paper:#fbf8f0;--muted:#6b7d74;--line:#e6dfcd;--sh:0 18px 46px rgba(6,32,25,.13)}
  body{font-family:"Noto Naskh Arabic","Amiri","Segoe UI",Tahoma,sans-serif;background:#f3efe4;
       color:var(--ink);line-height:1.75}
  svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
      stroke-linecap:round;stroke-linejoin:round;flex:none}
  a{text-decoration:none;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header{position:sticky;top:0;z-index:50;background:rgba(7,40,31,.95);backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(201,162,39,.28)}
  .hin{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hin h1{flex:1;font-size:clamp(15px,2.2vw,19px);color:#fff;font-weight:700;min-width:140px}
  .hb{display:flex;align-items:center;gap:7px;color:#d7e5dd;font-size:13.5px;padding:8px 13px;
    border-radius:10px;border:1px solid rgba(255,255,255,.15);transition:.2s;white-space:nowrap}
  .hb:hover{background:rgba(255,255,255,.12);color:#fff}
  .hb svg{width:17px;height:17px}

  .hello{background:linear-gradient(160deg,#07281f,#0e4636 65%,#0a3a2c);padding:34px 0 26px;
    border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
  .hello::after{content:"";position:absolute;inset:0;opacity:.18;
    background:url('img-unit_geometric.jpg') center/cover}
  .hello .in{position:relative;max-width:1180px;margin:0 auto;padding:0 20px;display:flex;
    gap:18px;align-items:center;flex-wrap:wrap}
  .av{width:62px;height:62px;border-radius:18px;border:1px solid rgba(201,162,39,.6);
    background:rgba(201,162,39,.14);display:grid;place-items:center;color:var(--gold-l)}
  .av svg{width:30px;height:30px}
  .hello h2{font-size:clamp(19px,3vw,27px);color:#fff;font-weight:700;line-height:1.35}
  .hello p{color:#cfe0d7;font-size:13.5px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:-24px 0 0;position:relative;z-index:4}
  .st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    border-inline-start:4px solid var(--gold);box-shadow:var(--sh)}
  .st b{display:block;font-size:24px;color:var(--emerald);line-height:1.2}
  .st span{font-size:12px;color:var(--muted)}
  @media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}

  h2.sec{font-size:clamp(18px,2.6vw,23px);color:var(--emerald);margin:34px 0 4px;
    display:flex;align-items:center;gap:9px;font-weight:700}
  h2.sec .dot{width:9px;height:9px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
  p.sub{font-size:13.5px;color:var(--muted);margin-bottom:16px}

  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:16px;padding-bottom:40px}
  .u{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.25s}
  .u:hover{transform:translateY(-3px);box-shadow:var(--sh)}
  .uimg{height:104px;background-size:cover;background-position:center;position:relative}
  .uimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,26,20,.1),rgba(4,26,20,.6))}
  .un{position:absolute;top:9px;inset-inline-start:11px;z-index:2;font-size:11.5px;font-weight:700;
    background:rgba(7,40,31,.85);border:1px solid rgba(201,162,39,.55);color:var(--gold-l);
    border-radius:999px;padding:2px 10px}
  .ub{padding:13px 15px 15px}
  .ub h3{font-size:16px;color:var(--emerald);margin-bottom:3px;font-weight:700}
  .ub .ls{font-size:12.3px;color:var(--muted);line-height:1.65;margin-bottom:12px;min-height:36px}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .b{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:10px;
    font-size:13.5px;font-weight:700;transition:.2s;position:relative}
  .b-g{background:var(--emerald);color:#fff}
  .b-g:hover{background:#125741}
  .b-e{background:#f3efe2;color:var(--emerald)}
  .b-e:hover{background:#e8e2d1}
  .score{position:absolute;top:-7px;inset-inline-end:-5px;background:var(--gold);color:#2b1f04;
    font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;border:1.5px solid #fff}

  .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;padding-bottom:50px}
  .tool{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;transition:.22s;display:block}
  .tool:hover{box-shadow:var(--sh);transform:translateY(-2px)}
  .tool .ic{width:38px;height:38px;border-radius:11px;background:#f3efe2;color:var(--emerald);
    display:grid;place-items:center;margin-bottom:10px}
  .tool b{display:block;font-size:14.5px;color:var(--emerald)}
  .tool span{font-size:12.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
    border-radius:13px;overflow:hidden;font-size:13.5px}
  th{background:#f4f0e4;color:var(--emerald);padding:9px;text-align:right;font-size:12.5px}
  td{padding:8px 9px;border-top:1px solid #f0ebdb;text-align:center}
  td:first-child,th:first-child{text-align:right}
  .hide{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hin">
    <a class="hb" href="دخول-الطالب.html"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>تغيير الاسم</a>
    <h1>بوابة الطالب</h1>
    <a class="hb" href="index.html"><svg viewBox="0 0 24 24"><path d="M4 12l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>الرئيسية</a>
  </div>
</header>

<section class="hello">
  <div class="in">
    <div class="av"><svg viewBox="0 0 24 24"><path d="M12 3l8 4-8 4-8-4 8-4z"/><path d="M4 11v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg></div>
    <div>
      <h2 id="who">—</h2>
      <p id="whoSub">—</p>
    </div>
  </div>
</section>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <h2 class="sec"><span class="dot"></span>الوحدات العشر</h2>
  <p class="sub">اختر وحدة وابدأ باللعبة التفاعلية ثم الاختبار.</p>
  <div class="units" id="units"></div>

  <h2 class="sec"><span class="dot"></span>أدوات</h2>
  <p class="sub">كل شيء داخل المنصة.</p>
  <div class="tools">
    <a class="tool" href="قارئ-نتائج-الطلاب.html">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M20 8V5a1 1 0 00-1-1h-3M4 16v3a1 1 0 001 1h3M20 16v3a1 1 0 01-1 1h-3M4 12h16"/></svg></div>
      <b>قارئ الشهادة</b><span>الصق رمز النتيجة لعرض تقريرك الكامل.</span></a>
    <a class="tool" href="#" id="myRes">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
      <b>نتائجي</b><span>كل محاولاتك على هذا الجهاز مع الدرجة والتاريخ.</span></a>
    <a class="tool" href="دليل-الاستخدام.html">
      <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></div>
      <b>دليل الاستخدام</b><span>خطوات اللعب وطباعة الشهادة.</span></a>
  </div>

  <div id="resBox" class="hide" style="margin-bottom:50px"></div>
</div>

<script src="platform.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var ar=PF.arNum;
  var name=PF.name();
  if(!name){ location.replace("دخول-الطالب.html"); return; }
  function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  $("#who").textContent = "أهلًا، " + name;
  $("#whoSub").textContent = "الصف " + PF.klass() + " · الشعبة " + PF.section() +
    (PF.school() ? " · " + PF.school() : "");

  var UNITS = [{"u": 1, "name": "مقدمة في التفسير", "lessons": ["التعريف بعلم التفسير ونشأته", "أهمية علم التفسير وضوابطه", "أبرز المؤلفات الموثوقة في التفسير", "التقنية في خدمة القرآن الكريم وتفسيره"], "game": "لعبة-الوحدة-01-مقدمة-في-التفسير.html", "exam": "اختبار-الوحدة-01-مقدمة-في-التفسير.html", "img": "unit_quran_open"}, {"u": 2, "name": "سورة الفاتحة", "lessons": ["تفسير سورة الفاتحة"], "game": "لعبة-الوحدة-02-سورة-الفاتحة.html", "exam": "اختبار-الوحدة-02-سورة-الفاتحة.html", "img": "unit_mosque"}, {"u": 3, "name": "سورة يونس", "lessons": ["تفسير سورة يونس (3-10)", "تفسير سورة يونس (26-33)", "تفسير سورة يونس (62-70)"], "game": "لعبة-الوحدة-03-سورة-يونس.html", "exam": "اختبار-الوحدة-03-سورة-يونس.html", "img": "unit_manuscript"}, {"u": 4, "name": "سورة هود", "lessons": ["تفسير سورة هود (96-108)", "تفسير سورة هود (112-123)"], "game": "لعبة-الوحدة-04-سورة-هود.html", "exam": "اختبار-الوحدة-04-سورة-هود.html", "img": "unit_sky"}, {"u": 5, "name": "سورة يوسف", "lessons": ["تفسير سورة يوسف (46-57)", "تفسير سورة يوسف (102-111)"], "game": "لعبة-الوحدة-05-سورة-يوسف.html", "exam": "اختبار-الوحدة-05-سورة-يوسف.html", "img": "unit_geometric"}, {"u": 6, "name": "سورة الرعد", "lessons": ["تفسير سورة الرعد (8-15)", "تفسير سورة الرعد (19-29)"], "game": "لعبة-الوحدة-06-سورة-الرعد.html", "exam": "اختبار-الوحدة-06-سورة-الرعد.html", "img": "unit_light"}, {"u": 7, "name": "سورة إبراهيم", "lessons": ["تفسير سورة إبراهيم (24-31)", "تفسير سورة إبراهيم (42-52)"], "game": "لعبة-الوحدة-07-سورة-إبراهيم.html", "exam": "اختبار-الوحدة-07-سورة-إبراهيم.html", "img": "unit_calligraphy"}, {"u": 8, "name": "سورة الحجر", "lessons": ["تفسير سورة الحجر (28-50)", "تفسير سورة الحجر (85-99)"], "game": "لعبة-الوحدة-08-سورة-الحجر.html", "exam": "اختبار-الوحدة-08-سورة-الحجر.html", "img": "unit_mosque"}, {"u": 9, "name": "سورة النحل", "lessons": ["تفسير سورة النحل (10-18)", "تفسير سورة النحل (112-117)", "تفسير سورة النحل (120-128)"], "game": "لعبة-الوحدة-09-سورة-النحل.html", "exam": "اختبار-الوحدة-09-سورة-النحل.html", "img": "unit_manuscript"}, {"u": 10, "name": "سورة الإسراء", "lessons": ["تفسير سورة الإسراء (23-30)", "تفسير سورة الإسراء (31-39)", "تفسير سورة الإسراء (78-87)", "تفسير سورة الإسراء (105-111)"], "game": "لعبة-الوحدة-10-سورة-الإسراء.html", "exam": "اختبار-الوحدة-10-سورة-الإسراء.html", "img": "unit_sky"}];
  var snap = PF.snapshots().filter(function(s){ return s.name===name; });

  function best(u,k){
    var l=snap.filter(function(s){ return s.unit===u && s.kind===k; });
    if(!l.length) return null;
    return Math.max.apply(null, l.map(function(s){ return Math.round(s.score/s.total*100); }));
  }
  function prog(){
    // تقدم = عدد الوحدات التي جُزيت لعبَتها
    var done=0;
    UNITS.forEach(function(u){ if (snap.some(function(s){ return s.unit===u.u && s.pass; })) done++; });
    return done;
  }

  var n=snap.length, pass=snap.filter(function(s){return s.pass}).length;
  var avg=n?Math.round(snap.reduce(function(a,s){return a+s.score/s.total*100},0)/n):0;
  $("#stats").innerHTML =
    '<div class="st"><b>'+ar(n)+'</b><span>محاولة</span></div>'+
    '<div class="st"><b>'+ar(pass)+'</b><span>اجتياز</span></div>'+
    '<div class="st"><b>'+ar(avg)+'%</b><span>متوسطك</span></div>'+
    '<div class="st"><b>'+ar(prog())+'/١٠</b><span>وحدات مكتملة</span></div>';

  var h="";
  UNITS.forEach(function(u){
    var g=best(u.u,"game"), e=best(u.u,"exam");
    h+='<div class="u"><div class="uimg" style="background-image:url(\'img-'+u.img+'.jpg\')">'+
       '<span class="un">الوحدة '+ar(u.u)+'</span></div>'+
       '<div class="ub"><h3>'+esc(u.name)+'</h3>'+
       '<div class="ls">'+u.lessons.map(esc).join(" · ")+'</div>'+
       '<div class="acts">'+
         '<a class="b b-g" href="'+u.game+'">اللعبة'+(g!=null?'<span class="score">'+ar(g)+'%</span>':'')+'</a>'+
         '<a class="b b-e" href="'+u.exam+'">الاختبار'+(e!=null?'<span class="score">'+ar(e)+'%</span>':'')+'</a>'+
       '</div></div></div>';
  });
  $("#units").innerHTML=h;

  $("#myRes").addEventListener("click", function(ev){
    ev.preventDefault();
    var box=$("#resBox");
    if(!snap.length){ box.innerHTML='<div style="background:#fdf6e4;border:1px solid #ead9a8;border-radius:11px;padding:10px 13px;font-size:13px;color:#7a6522">لا نتائج محفوظة على هذا الجهاز بعد.</div>'; }
    else{
      var mine=snap.slice().reverse();
      var t='<table><thead><tr><th>الوحدة</th><th>النوع</th><th>الدرجة</th><th>النتيجة</th><th>التاريخ</th></tr></thead><tbody>';
      mine.forEach(function(s){
        t+='<tr><td>'+ar(s.unit)+'</td><td>'+(s.kind==="game"?"لعبة":"اختبار")+'</td>'+
           '<td>'+ar(s.score)+"/"+ar(s.total)+'</td><td>'+(s.pass?"اجتياز":"—")+'</td>'+
           '<td style="font-size:12px">'+esc(s.date||"")+'</td></tr>';
      });
      box.innerHTML=t+'</tbody></table>';
    }
    box.classList.toggle("hide");
  });
})();
</script>
</body>
</html>
