<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تفسير سورة هود (96-108) — القرآن الكريم وتفسيره ١</title>
<style>
@font-face{font-family:'AmiriX';src:url('amiri.woff2') format('woff2');font-display:swap}
@font-face{font-family:'AmiriX';font-weight:700;src:url('amiri.woff2') format('woff2');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
:root{--emerald:#0e4636;--ed:#07281f;--gold:#c9a227;--goldl:#f2dfa4;--paper:#fbf8f0;--ink:#0b241d}
html,body{height:100%}
body{font-family:"Noto Naskh Arabic",'AmiriX',"Amiri",Tahoma,sans-serif;background:var(--ed);color:#fff;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* الإطار */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-shrink:0;
  background:rgba(4,26,20,.72);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,162,39,.28);z-index:5}
.hb{display:flex;align-items:center;gap:6px;font-size:13.5px;color:#cfe0d7;padding:7px 12px;
  border-radius:9px;border:1px solid rgba(255,255,255,.16);transition:.2s;text-decoration:none}
.hb:hover{background:rgba(255,255,255,.1);color:#fff}
h1{flex:1;font-size:14.5px;font-weight:700;color:#fff;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--goldl);white-space:nowrap}

#stage{flex:1;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;
  transition:opacity .7s, transform 8s linear;opacity:.3;transform:scale(1.05)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(18px,4vw,56px);opacity:0;visibility:hidden;transform:translateY(18px);
  transition:opacity .45s, transform .45s, visibility .45s;overflow-y:auto}
.slide.on{opacity:1;visibility:visible;transform:none}
.slide.out{transform:translateY(-14px)}
.kick{font-size:12.5px;letter-spacing:.09em;color:var(--goldl);font-weight:700;margin-bottom:8px;
  opacity:0;animation:fade .5s .05s forwards}
.stitle{font-size:clamp(19px,3.6vw,32px);font-weight:700;line-height:1.35;margin-bottom:18px;
  color:#fff;opacity:0;animation:fade .5s .12s forwards}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* الغلاف */
.cover{align-items:center;text-align:center}
.cover .stamp{border:1px solid rgba(201,162,39,.6);color:var(--goldl);border-radius:999px;
  padding:5px 18px;font-size:12.5px;letter-spacing:.06em;opacity:0;animation:fade .6s .05s forwards}
.cover h2{font-size:clamp(24px,5.2vw,46px);margin:16px 0 10px;line-height:1.3;opacity:0;animation:fade .6s .18s forwards}
.cover .ax{color:#bcd2c7;font-size:clamp(12.5px,2vw,15px);opacity:0;animation:fade .6s .3s forwards}
.cover .ref{margin-top:12px;color:var(--goldl);font-size:13px;opacity:0;animation:fade .6s .4s forwards}
.cover .go{margin-top:28px;opacity:0;animation:fade .6s .5s forwards}
.cover .go button{background:linear-gradient(180deg,#17795c,#0b3d2e);border:1px solid rgba(201,162,39,.5);
  padding:13px 34px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 16px 34px rgba(0,0,0,.4)}
.cover .go button:hover{filter:brightness(1.1)}

/* القوائم */
.items{display:flex;flex-direction:column;gap:11px;max-width:900px}
.it{display:flex;gap:11px;align-items:flex-start;background:rgba(255,255,255,.055);
  border:1px solid rgba(201,162,39,.22);border-right:3px solid var(--gold);border-radius:12px;
  padding:13px 16px;font-size:clamp(14px,2.1vw,17px);line-height:1.85;color:#e9f1ec;
  opacity:0;animation:rise .45s forwards}
.it b{color:var(--goldl);font-weight:700;flex-shrink:0}

/* الآيات */
.ayat{display:flex;flex-direction:column;gap:12px;max-width:960px;width:100%}
.ay{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
  border:1px solid rgba(201,162,39,.34);border-radius:14px;padding:14px 16px 14px 54px;
  opacity:0;animation:rise .5s forwards}
.ay .qt{font-family:'AmiriX',"Amiri",serif;font-size:clamp(16px,2.6vw,23px);line-height:2.1;
  color:#fff;text-align:right}
.ay .num{position:absolute;inset-inline-end:14px;top:12px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--gold);display:grid;place-items:center;font-size:12px;color:var(--goldl);
  background:rgba(201,162,39,.12)}
.ay .play{position:absolute;inset-inline-start:10px;bottom:10px;width:36px;height:36px;border-radius:50%;
  background:rgba(14,70,54,.85);border:1px solid rgba(201,162,39,.5);display:grid;place-items:center;color:#fff}
.ay .play.on{background:var(--gold);color:#20180a}
.ay .play svg{width:16px;height:16px}

/* الحوار */
.dlg{display:flex;flex-direction:column;gap:10px;max-width:820px}
.bub{max-width:88%;padding:11px 15px;border-radius:14px;font-size:clamp(13.5px,2vw,16px);line-height:1.85;
  opacity:0;animation:rise .4s forwards}
.bub.t{background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.45);align-self:flex-start}
.bub.s{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);align-self:flex-end}
.bub .who{display:block;font-size:11.5px;color:var(--goldl);font-weight:700;margin-bottom:3px}

/* القصة */
.story .txt{font-size:clamp(14.5px,2.3vw,19px);line-height:2.15;color:#e6efe9;max-width:860px;
  opacity:0;animation:rise .5s forwards}
.story .first{font-family:'AmiriX',serif;font-size:clamp(19px,3vw,28px);color:var(--goldl);margin-bottom:10px}

/* الرحلة */
.steps{display:flex;flex-wrap:wrap;gap:12px;max-width:980px;margin-top:6px}
.step{flex:1 1 200px;background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.28);
  border-radius:14px;padding:14px 15px;opacity:0;animation:rise .45s forwards}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--emerald);border:1px solid var(--gold);
  display:grid;place-items:center;font-size:12.5px;color:var(--goldl);margin-bottom:8px}
.step .x{font-size:clamp(13px,1.9vw,15.5px);line-height:1.8;color:#e2ece6}

/* النهاية */
.end{align-items:center;text-align:center}
.end h2{font-size:clamp(21px,3.6vw,32px);margin-bottom:8px}
.end p{color:#bcd2c7;font-size:14px;margin-bottom:24px}
.end .acts{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
.end a{display:flex;align-items:center;gap:7px;padding:12px 20px;border-radius:12px;text-decoration:none;
  font-size:14px;font-weight:700;background:rgba(255,255,255,.08);border:1px solid rgba(201,162,39,.4);color:#fff}
.end a.pri{background:linear-gradient(180deg,#17795c,#0b3d2e)}

/* الشريط السفلي */
footer{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:rgba(4,26,20,.78);backdrop-filter:blur(10px);border-top:1px solid rgba(201,162,39,.24);z-index:5}
.nav{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;
  border:1px solid rgba(255,255,255,.16);color:#dbe8e1;font-size:13px;transition:.2s}
.nav:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff}
.nav:disabled{opacity:.32;cursor:default}
.dots{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.24);transition:.2s}
.dot.on{background:var(--gold);transform:scale(1.35)}
.cnt{font-size:12px;color:#9fb8ab;white-space:nowrap}
#bar{position:absolute;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#f6e7b4);
  transition:width .4s;z-index:6;border-radius:0 0 0 3px}

/* قائمة الشرائح */
#list{position:fixed;inset:0;z-index:20;background:rgba(4,26,20,.96);backdrop-filter:blur(8px);
  display:none;padding:24px;overflow-y:auto}
#list.on{display:block}
#list h3{color:var(--goldl);font-size:15px;margin-bottom:14px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:900px;margin:0 auto}
.lcard{background:rgba(255,255,255,.07);border:1px solid rgba(201,162,39,.28);border-radius:11px;
  padding:11px 13px;text-align:right;font-size:13px;color:#e2ece6;min-height:70px}
.lcard.on{border-color:var(--gold);background:rgba(201,162,39,.16)}
.lcard .k{display:block;font-size:10.5px;color:var(--goldl);margin-bottom:3px}
@media(max-width:560px){
  header h1{font-size:12.5px}.hb span{display:none}.hb{padding:8px}
  footer{gap:6px;padding:9px 10px}.nav span{display:none}.nav{padding:9px 12px}
  .ay{padding:12px 13px 48px}.ay .num{width:26px;height:26px;font-size:11px}
}
</style>
</head>

function pad(n){ return ('0'+n).slice(-2); }
function pad2(n){ return ('0'+n).slice(-2); }

/* ─── التنقل ─── */
function show(n, silent){
  if (n < 0 || n >= S.length) return;
  stopAudio();
  var old = document.querySelector('.slide.on');
  if (old && !silent){ old.classList.add('out'); old.classList.remove('on'); }
  i = n;
  var cur = document.querySelector('.slide.s'+i);
  if (cur){ cur.classList.remove('out'); cur.classList.add('on'); }
  document.querySelectorAll('.dot').forEach(function(d,k){ d.classList.toggle('on', k===i); });
  document.querySelectorAll('.lcard').forEach(function(d,k){ d.classList.toggle('on', k===i); });
  document.getElementById('cnt').textContent = AR(i+1)+' / '+AR(S.length);
  document.getElementById('prev').disabled = (i===0);
  document.getElementById('next').disabled = (i===S.length-1);
  document.getElementById('bar').style.width = ((i+1)/S.length*100)+'%';
  var bg = document.getElementById('bg');
  bg.style.backgroundImage = "url('../img-"+BG[i%BG.length]+".jpg')";
  var sb = document.getElementById('startBtn');
  if (sb) sb.onclick = function(){ show(i+1); };
}
function next(){ show(i+1); }
function prev(){ show(i-1); }

/* ─── الصوت ─── */
function bindAudio(){
  document.querySelectorAll('.play').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      if (playing === b){ stopAudio(); return; }
      stopAudio();
      audio = new Audio(b.dataset.src);
      audio.play().catch(function(){ b.style.opacity=.4; });
      playing = b; b.classList.add('on'); b.innerHTML = Icons.pause;
      audio.onended = function(){ stopAudio(); };
    };
  });
}
function stopAudio(){
  if (audio){ try{ audio.pause(); }catch(e){} audio = null; }
  if (playing){ playing.classList.remove('on'); playing.innerHTML = Icons.play; playing = null; }
}

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('dots').onclick = function(e){
  var d = e.target.closest('.dot'); if (d) show(+d.dataset.k);
};
document.getElementById('lgrid').onclick = function(e){
  var d = e.target.closest('.lcard'); if (d){ show(+d.dataset.k); document.getElementById('list').classList.remove('on'); }
};
document.getElementById('btnList').onclick = function(){ document.getElementById('list').classList.toggle('on'); };
document.getElementById('list').onclick = function(e){ if (e.target.id==='list') this.classList.remove('on'); };
document.getElementById('btnFull').onclick = function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
};
document.addEventListener('keydown', function(e){
  if (['ArrowLeft','ArrowDown','PageDown',' '].indexOf(e.key)>=0){ e.preventDefault(); next(); }
  else if (['ArrowRight','ArrowUp','PageUp'].indexOf(e.key)>=0){ e.preventDefault(); prev(); }
  else if (e.key==='Escape'){ document.getElementById('list').classList.remove('on'); }
  else if (e.key==='Home'){ show(0); } else if (e.key==='End'){ show(S.length-1); }
});
var tx=0, ty=0;
document.getElementById('stage').addEventListener('touchstart', function(e){
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
}, {passive:true});
document.getElementById('stage').addEventListener('touchend', function(e){
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if (Math.abs(dx)>52 && Math.abs(dx)>Math.abs(dy)){ dx<0 ? next() : prev(); }
}, {passive:true});

render();
</script>
</body>
</html>
